<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HWA AI - Movie Recap Studio</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #090a0f;
      color: #f4f4f5;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 24px 32px;
      border-bottom: 1px solid #242631;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
    }

    .logo span {
      color: #805cff;
    }

    .ready {
      color: #55e58a;
      font-size: 15px;
    }

    .container {
      max-width: 760px;
      margin: auto;
      padding: 55px 20px;
    }

    h1 {
      text-align: center;
      font-size: 40px;
      margin-bottom: 15px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      font-size: 18px;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .card {
      background: #171923;
      border: 1px solid #292c38;
      border-radius: 22px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .login-card {
      text-align: center;
    }

    .login-card h2 {
      margin-top: 0;
    }

    .email {
      color: #9477ff;
      font-size: 18px;
      margin: 12px 0 20px;
      word-break: break-word;
    }

    label {
      display: block;
      font-size: 17px;
      color: #c7c9d2;
      margin: 20px 0 10px;
    }

    input,
    select {
      width: 100%;
      padding: 18px;
      border-radius: 15px;
      border: 1px solid #30333e;
      background: #0d0f15;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #805cff;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 15px;
      padding: 17px;
      margin-top: 20px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .google {
      background: white;
      color: #111;
    }

    .start {
      background: #805cff;
      color: white;
      font-size: 18px;
    }

    .start:disabled {
      background: #393342;
      color: #888;
      cursor: not-allowed;
    }

    .logout {
      background: #282b35;
      color: white;
      margin-top: 0;
    }

    .status {
      margin-top: 20px;
      padding: 16px;
      border-radius: 14px;
      background: #20232d;
      color: #bfc2cc;
      line-height: 1.6;
    }

    .hidden {
      display: none;
    }

    .progress {
      height: 10px;
      background: #2a2d37;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 15px;
    }

    .bar {
      width: 0%;
      height: 100%;
      background: #805cff;
      transition: width .4s;
    }

    .plan {
      margin-top: 18px;
      padding: 18px;
      border-radius: 15px;
      background: #101219;
      border: 1px solid #2b2e39;
    }

    .part {
      padding: 9px 0;
      border-bottom: 1px solid #252832;
      color: #bbb;
    }

    .part:last-child {
      border-bottom: 0;
    }

    .ok {
      color: #55e58a;
    }

    .error {
      color: #ff7777;
    }

    @media (max-width: 600px) {
      header {
        padding: 20px;
      }

      .container {
        padding-top: 35px;
      }

      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    HWA <span>AI</span>
  </div>

  <div class="ready">
    ● AI Ready
  </div>
</header>

<div class="container">

  <h1>Movie Recap Studio</h1>

  <div class="subtitle">
    YouTube Video ကို မြန်မာလို Recap ပြုလုပ်ပေးမယ့် AI
  </div>

  <!-- LOGIN -->
  <div class="card login-card">

    <div id="loggedOut">

      <h2>🔐 HWA AI Login</h2>

      <p style="color:#aaa;">
        Google Account ဖြင့် Login ဝင်ပြီး HWA AI ကိုအသုံးပြုပါ။
      </p>

      <button class="google" onclick="loginWithGoogle()">
        Continue with Google
      </button>

    </div>

    <div id="loggedIn" class="hidden">

      <h2>👤 Logged in</h2>

      <div id="userEmail" class="email"></div>

      <button class="logout" onclick="logout()">
        Logout
      </button>

    </div>

  </div>


  <!-- MAIN TOOL -->
  <div id="mainTool" class="card hidden">

    <label>
      YouTube Video Link
    </label>

    <input
      id="youtubeUrl"
      type="url"
      placeholder="https://www.youtube.com/watch?v=..."
      oninput="checkInput()"
    >


    <label>
      Recap Language
    </label>

    <select id="language">
      <option value="my">မြန်မာ</option>
      <option value="en">English</option>
    </select>


    <label>
      Recap Length
    </label>

    <select id="recapLength">
      <option value="auto">Auto — Video Duration အလိုက်</option>
      <option value="short">Short</option>
      <option value="medium" selected>Medium</option>
      <option value="long">Long</option>
    </select>


    <button
      id="startButton"
      class="start"
      onclick="startRecap()"
      disabled
    >
      🎬 Start Movie Recap
    </button>


    <div id="statusBox" class="status">
      🟢 Backend Connected — HWA AI Ready
    </div>


    <div id="progressBox" class="hidden">

      <div id="progressText">
        Preparing...
      </div>

      <div class="progress">
        <div id="progressBar" class="bar"></div>
      </div>

    </div>


    <div id="planBox" class="plan hidden"></div>

  </div>

</div>


<script>

  // ==========================================
  // SUPABASE CONFIG
  // ==========================================

  const SUPABASE_URL =
    "https://ovobepocmajyrkyzkrsu.supabase.co";

  // IMPORTANT:
  // Replace this with your Supabase PUBLISHABLE KEY
  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_L5Ch_awKHbdQJ8f_6sxJHQ_llUl394l";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  // ==========================================
  // GOOGLE LOGIN
  // ==========================================

  async function loginWithGoogle() {

    try {

      const { error } =
        await supabaseClient.auth.signInWithOAuth({

          provider: "google",

          options: {
            redirectTo: window.location.origin
          }

        });

      if (error) {
        alert(error.message);
      }

    } catch (error) {

      console.error(error);

      alert("Google Login failed.");

    }

  }


  // ==========================================
  // LOGOUT
  // ==========================================

  async function logout() {

    await supabaseClient.auth.signOut();

    location.reload();

  }


  // ==========================================
  // CHECK LOGIN
  // ==========================================

  async function checkAuth() {

    const {
      data: {
        session
      }
    } = await supabaseClient.auth.getSession();


    if (session && session.user) {

      document
        .getElementById("loggedOut")
        .classList
        .add("hidden");

      document
        .getElementById("loggedIn")
        .classList
        .remove("hidden");

      document
        .getElementById("mainTool")
        .classList
        .remove("hidden");

      document
        .getElementById("userEmail")
        .textContent =
        session.user.email || "Google User";

    }

  }


  // ==========================================
  // YOUTUBE URL CHECK
  // ==========================================

  function isYouTubeUrl(url) {

    try {

      const u = new URL(url);

      return (
        u.hostname.includes("youtube.com") ||
        u.hostname.includes("youtu.be")
      );

    } catch {

      return false;

    }

  }


  function checkInput() {

    const url =
      document
        .getElementById("youtubeUrl")
        .value
        .trim();

    const button =
      document.getElementById("startButton");

    button.disabled =
      !isYouTubeUrl(url);

  }


  // ==========================================
  // START RECAP
  // ==========================================

  async function startRecap() {

    const url =
      document
        .getElementById("youtubeUrl")
        .value
        .trim();

    if (!isYouTubeUrl(url)) {

      alert("YouTube Link မှန်မှန်ထည့်ပါ။");

      return;

    }


    const status =
      document.getElementById("statusBox");

    const progressBox =
      document.getElementById("progressBox");

    const progressBar =
      document.getElementById("progressBar");

    const progressText =
      document.getElementById("progressText");

    const planBox =
      document.getElementById("planBox");

    const button =
      document.getElementById("startButton");


    button.disabled = true;

    progressBox.classList.remove("hidden");

    planBox.classList.add("hidden");

    progressBar.style.width = "10%";

    progressText.textContent =
      "🔎 Video information ကို စစ်နေပါတယ်...";

    status.innerHTML =
      "⏳ HWA AI is preparing your video...";


    /*
      NOTE:
      ဒီအဆင့်မှာ backend က YouTube duration
      ကို တကယ်ဖတ်တဲ့ endpoint ကို နောက်အဆင့်မှာ
      ထည့်မယ်။

      အခုတော့ backend health ကိုစစ်ပြီး
      processing system အတွက် foundation
      ချိတ်ထားပါတယ်။
    */


    try {

      const healthResponse =
        await fetch("/api/health");

      if (!healthResponse.ok) {
        throw new Error("Backend unavailable");
      }


      progressBar.style.width = "35%";

      progressText.textContent =
        "🎬 Video processing plan ပြင်ဆင်နေပါတယ်...";


      /*
        Current backend API requires duration_seconds.

        Actual YouTube duration extraction
        will be connected in the next backend step.
      */


      await new Promise(
        resolve => setTimeout(resolve, 800)
      );


      progressBar.style.width = "60%";

      progressText.textContent =
        "🧠 Dynamic processing system Ready";


      status.innerHTML =
        "<span class='ok'>✅ Backend Connected</span><br>" +
        "YouTube Link လက်ခံပြီးပါပြီ။<br>" +
        "နောက်တစ်ဆင့်မှာ Video Duration ကို အလိုအလျောက်ဖတ်ပြီး " +
        "10 မိနစ်စီခွဲ Process လုပ်ပါမယ်။";


      progressBar.style.width = "100%";


      planBox.classList.remove("hidden");

      planBox.innerHTML = `
        <strong>⚙️ Dynamic Processing</strong>

        <p style="color:#aaa;">
          Video အတို/အရှည်အလိုက် အလိုအလျောက်တွက်မယ်။
        </p>

        <div class="part">
          🎬 20 min → 2 parts
        </div>

        <div class="part">
          🎬 1h 05m → 7 parts
        </div>

        <div class="part">
          🎬 2h 05m → 13 parts
        </div>

        <p class="ok">
          ✓ 10-minute chunk system Ready
        </p>
      `;


    } catch (error) {

      console.error(error);

      status.innerHTML =
        "<span class='error'>❌ Backend connection failed.</span>";

      progressText.textContent =
        "Processing failed.";

    }


    button.disabled = false;

  }


  // ==========================================
  // INITIALIZE
  // ==========================================

  checkAuth();

</script>

</body>
  </html>
