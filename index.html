<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HWA AI - Movie Recap</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans Myanmar",sans-serif;
  background:#0b0d12;
  color:#fff;
}
header{
  padding:18px 20px;
  border-bottom:1px solid #252832;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{
  font-size:24px;
  font-weight:bold;
}
.logo span{color:#7c5cff}
.status{
  color:#55e68a;
  font-size:13px;
}
.container{
  max-width:850px;
  margin:auto;
  padding:30px 18px;
}
.hero{
  text-align:center;
  margin-bottom:30px;
}
.hero h1{
  font-size:32px;
  margin:10px 0;
}
.hero p{
  color:#9da3b0;
}
.card{
  background:#13161d;
  border:1px solid #272b36;
  border-radius:18px;
  padding:22px;
  margin-bottom:18px;
}
label{
  display:block;
  margin-bottom:8px;
  color:#cbd0da;
}
input,select,textarea{
  width:100%;
  background:#0d1016;
  border:1px solid #303542;
  color:#fff;
  border-radius:10px;
  padding:14px;
  outline:none;
  font-size:15px;
}
input:focus,textarea:focus{
  border-color:#7c5cff;
}
textarea{
  min-height:300px;
  resize:vertical;
  line-height:1.7;
}
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
button{
  width:100%;
  border:0;
  border-radius:11px;
  padding:15px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
.primary{
  background:#7c5cff;
  color:white;
}
.primary:disabled{
  background:#363944;
  color:#888;
  cursor:not-allowed;
}
.secondary{
  background:#242832;
  color:white;
  margin-top:10px;
}
.result{
  display:none;
}
.message{
  margin-top:12px;
  padding:12px;
  border-radius:9px;
  background:#1c2029;
  color:#b9c0cc;
  font-size:14px;
}
.loading{
  display:none;
  text-align:center;
  padding:15px;
  color:#9d8cff;
}
@media(max-width:600px){
  .row{grid-template-columns:1fr}
  .hero h1{font-size:27px}
}
</style>
</head>

<body>

<header>
  <div class="logo">HWA <span>AI</span></div>
  <div class="status">● AI Ready</div>
</header>

<div class="container">

  <div class="hero">
    <h1>Movie Recap Studio</h1>
    <p>ဗီဒီယိုထဲက ဇာတ်လမ်းကို မြန်မာလို သဘာဝကျကျ Recap ပြန်ရေးပေးမယ့် AI</p>
  </div>

  <div class="card">
    <label>YouTube Video Link</label>
    <input
      id="youtubeUrl"
      type="url"
      placeholder="https://www.youtube.com/watch?v=..."
    >

    <div class="row" style="margin-top:15px">
      <div>
        <label>Recap Language</label>
        <select id="language">
          <option value="my">မြန်မာ</option>
          <option value="en">English</option>
        </select>
      </div>

      <div>
        <label>Recap Length</label>
        <select id="length">
          <option value="short">Short</option>
          <option value="medium" selected>Medium</option>
          <option value="long">Long</option>
        </select>
      </div>
    </div>

    <button
      class="primary"
      id="startBtn"
      style="margin-top:18px"
      onclick="startRecap()"
    >
      🎬 Start Movie Recap
    </button>

    <div class="loading" id="loading">
      ⏳ AI က လုပ်ဆောင်နေပါတယ်...
    </div>

    <div class="message" id="message">
      Backend: စစ်ဆေးနေပါတယ်...
    </div>
  </div>

  <div class="card result" id="resultCard">
    <label>AI Recap Script</label>

    <textarea
      id="script"
      placeholder="AI ထုတ်ပေးမယ့် မြန်မာ Recap Script..."
    ></textarea>

    <button class="secondary" onclick="copyScript()">
      📋 Copy Script
    </button>

    <button class="secondary" onclick="downloadScript()">
      ⬇️ Download TXT
    </button>
  </div>

</div>

<script>

const BACKEND =
  "https://hwa-ai.onrender.com";

async function checkBackend(){

  const message =
    document.getElementById("message");

  try{

    const response =
      await fetch(BACKEND + "/api/health");

    const data =
      await response.json();

    if(data.success){

      message.innerHTML =
        "✅ Backend Connected — HWA AI Ready";

    }else{

      message.innerHTML =
        "⚠️ Backend response မမှန်ပါ";

    }

  }catch(error){

    message.innerHTML =
      "❌ Backend ချိတ်မရပါ";

  }
}

async function startRecap(){

  const url =
    document.getElementById("youtubeUrl").value.trim();

  const message =
    document.getElementById("message");

  const loading =
    document.getElementById("loading");

  const resultCard =
    document.getElementById("resultCard");

  const startBtn =
    document.getElementById("startBtn");

  if(!url){

    message.innerHTML =
      "⚠️ YouTube Link အရင်ထည့်ပါ";

    return;
  }

  if(
    !url.includes("youtube.com") &&
    !url.includes("youtu.be")
  ){

    message.innerHTML =
      "⚠️ YouTube Link မမှန်ပါ";

    return;
  }

  startBtn.disabled = true;
  loading.style.display = "block";

  message.innerHTML =
    "🎬 Video ကို စတင်စစ်ဆေးနေပါတယ်...";

  resultCard.style.display = "block";

  try{

    /*
      Backend API ကို နောက်အဆင့်မှာ
      YouTube → Transcript → Myanmar Recap
      အဖြစ် ချိတ်ပေးမယ်။
    */

    await new Promise(
      resolve => setTimeout(resolve,1200)
    );

    document.getElementById("script").value =
`HWA AI Movie Recap

YouTube Video:
${url}

ဒီနေရာမှာ AI က Movie Transcript ကို
ခွဲခြမ်းစိတ်ဖြာပြီး သဘာဝကျတဲ့
မြန်မာ Movie Recap Script ကို
ထုတ်ပေးမှာဖြစ်ပါတယ်။

နောက်အဆင့်မှာ ဒီနေရာကို
တကယ် AI-generated Recap နဲ့
ချိတ်ပေးပါမယ်။`;

    message.innerHTML =
      "✅ Recap Editor Ready";

  }catch(error){

    message.innerHTML =
      "❌ Error ဖြစ်သွားပါတယ်";

  }finally{

    loading.style.display = "none";
    startBtn.disabled = false;

  }
}

function copyScript(){

  const script =
    document.getElementById("script");

  navigator.clipboard.writeText(
    script.value
  );

  alert("Script copied!");
}

function downloadScript(){

  const text =
    document.getElementById("script").value;

  const blob =
    new Blob([text],{
      type:"text/plain;charset=utf-8"
    });

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;
  a.download = "HWA-AI-Recap.txt";
  a.click();

  URL.revokeObjectURL(url);
}

checkBackend();

</script>

</body>
</html>
