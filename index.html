<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HWA AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: #151c30;
      border: 1px solid #293451;
      border-radius: 22px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 20px;
      background: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      margin: 8px 0 28px;
      color: #9ca9c7;
      font-size: 15px;
    }

    .google-btn {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 15px;
      background: white;
      color: #111827;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .google-btn:active {
      transform: scale(.98);
    }

    .status {
      margin-top: 18px;
      min-height: 24px;
      color: #9ca9c7;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    .home {
      text-align: left;
    }

    .welcome {
      margin-bottom: 20px;
    }

    .user-email {
      color: #9ca9c7;
      font-size: 14px;
      word-break: break-all;
    }

    .logout {
      width: 100%;
      padding: 13px;
      border: 1px solid #394563;
      background: transparent;
      color: white;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- LOGIN -->
    <section id="loginCard" class="card">

      <div class="logo">H</div>

      <h1>HWA AI</h1>

      <div class="subtitle">
        AI Video to Myanmar Recap
      </div>

      <button id="googleLogin" class="google-btn">
        Continue with Google
      </button>

      <div id="status" class="status"></div>

    </section>


    <!-- HOME -->
    <section id="homeCard" class="card home hidden">

      <div class="welcome">
        <h1>HWA AI</h1>
        <p>Welcome to HWA AI</p>
        <div id="userEmail" class="user-email"></div>
      </div>

      <button id="logout" class="logout">
        Sign Out
      </button>

    </section>

  </main>


  <script type="module">

    /*
      Supabase configuration will be connected
      in the next step.
    */

    const loginCard = document.getElementById("loginCard");
    const homeCard = document.getElementById("homeCard");
    const googleLogin = document.getElementById("googleLogin");
    const logout = document.getElementById("logout");
    const status = document.getElementById("status");
    const userEmail = document.getElementById("userEmail");

    googleLogin.addEventListener("click", () => {
      status.textContent = "Google Login connection is being prepared...";
    });

    logout.addEventListener("click", () => {
      homeCard.classList.add("hidden");
      loginCard.classList.remove("hidden");
      status.textContent = "";
    });

  </script>

</body>
      </html>
