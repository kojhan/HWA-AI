<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HWA AI - Movie Recap</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: white;
    }

    .app {
      max-width: 700px;
      margin: auto;
      padding: 25px 18px;
    }

    .header {
      text-align: center;
      padding: 25px 0;
    }

    .logo {
      font-size: 34px;
      font-weight: bold;
    }

    .sub {
      color: #9aa4b2;
      margin-top: 6px;
    }

    .card {
      background: #121821;
      border: 1px solid #26303d;
      border-radius: 18px;
      padding: 20px;
      margin-top: 18px;
    }

    input, textarea, button {
      width: 100%;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
    }

    input, textarea {
      background: #0b0f14;
      color: white;
      border: 1px solid #303b49;
      outline: none;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    button {
      border: 0;
      margin-top: 12px;
      font-weight: bold;
      cursor: pointer;
      background: #4f8cff;
      color: white;
    }

    button.secondary {
      background: #202a36;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #0d141c;
      color: #9fb0c3;
      text-align: center;
    }

    .hidden {
      display: none;
    }

    .user {
      text-align: center;
      color: #b8c5d3;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">HWA AI</div>
    <div class="sub">Movie Recap Studio</div>
  </div>

  <!-- LOGIN -->
  <div id="loginCard" class="card">
    <h2>Google Login</h2>
    <p>HWA AI ကိုအသုံးပြုရန် Google Account ဖြင့် Login ဝင်ပါ။</p>

    <button onclick="googleLogin()">
      Continue with Google
    </button>

    <button class="secondary" onclick="checkBackend()">
      Check HWA AI Backend
    </button>

    <div id="loginStatus" class="status">
      AI Ready
    </div>
  </div>

  <!-- HOME -->
  <div id="homeCard" class="card hidden">

    <div id="userInfo" class="user"></div>

    <h2>🎬 Movie Recap</h2>

    <input
      id="youtubeUrl"
      type="url"
      placeholder="YouTube Link ထည့်ပါ"
    >

    <button onclick="startRecap()">
      🚀 Start Myanmar Recap
    </button>

    <div id="recapStatus" class="status">
      Ready
    </div>

    <textarea
      id="script"
      placeholder="AI Myanmar Recap Script ဒီနေရာမှာ ပေါ်လာပါမယ်..."
    ></textarea>

    <button class="secondary" onclick="copyScript()">
      📋 Copy Script
    </button>

    <button class="secondary" onclick="downloadScript()">
      ⬇️ Download TXT
    </button>

    <button class="secondary" onclick="logout()">
      Logout
    </button>

  </div>

</div>

<script>

  // ==============================
  // HWA AI CONFIG
  // ==============================

  const SUPABASE_URL =
    "https://ovobepocmajyrkyzkrsu.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "704997142802-hkvu536qtt4q62lnl5b5093sb6n7rqf7.apps.googleusercontent.com";

  const BACKEND_URL =
    "https://hwa-ai.onrender.com";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  // ==============================
  // GOOGLE LOGIN
  // ==============================

  async function googleLogin() {

    const status =
      document.getElementById("loginStatus");

    status.innerText = "Google Login ဖွင့်နေပါပြီ...";

    const { error } =
      await supabaseClient.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo: window.location.origin
        }
      });

    if (error) {
      status.innerText =
        "Login Error: " + error.message;
    }
  }


  // ==============================
  // CHECK LOGIN
  // ==============================

  async function checkUser() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if (session) {

      document
        .getElementById("loginCard")
        .classList.add("hidden");

      document
        .getElementById("homeCard")
        .classList.remove("hidden");

      document
        .getElementById("userInfo")
        .innerText =
        "Logged in: " +
        (session.user.email || "Google User");

    }
  }


  // ==============================
  // BACKEND CHECK
  // ==============================

  async function checkBackend() {

    const status =
      document.getElementById("loginStatus");

    status.innerText =
      "Backend စစ်ဆေးနေပါတယ်...";

    try {

      const response =
        await fetch(BACKEND_URL);

      const data =
        await response.json();

      if (data.success) {

        status.innerText =
          "✅ HWA AI Backend Ready";

      } else {

        status.innerText =
          "Backend response မမှန်ပါ";

      }

    } catch (error) {

      status.innerText =
        "❌ Backend ချိတ်မရပါ";

    }
  }


  // ==============================
  // START RECAP
  // ==============================

  async function startRecap() {

    const url =
      document.getElementById("youtubeUrl").value.trim();

    const status =
      document.getElementById("recapStatus");

    if (!url) {

      status.innerText =
        "YouTube Link အရင်ထည့်ပါ";

      return;
    }

    status.innerText =
      "⏳ Recap processing စတင်နေပါတယ်...";

    /*
      ဒီနေရာမှာ နောက်တစ်ဆင့်တွင်
      HWA AI Movie Recap API ကို ချိတ်ပေးမယ်။
    */

    setTimeout(() => {

      status.innerText =
        "✅ YouTube Link လက်ခံပြီးပါပြီ။ AI processing API ကို ဆက်ချိတ်မယ်။";

    }, 1000);
  }


  // ==============================
  // COPY
  // ==============================

  async function copyScript() {

    const text =
      document.getElementById("script").value;

    if (!text) return;

    await navigator.clipboard.writeText(text);

    alert("Script copied!");
  }


  // ==============================
  // DOWNLOAD
  // ==============================

  function downloadScript() {

    const text =
      document.getElementById("script").value;

    if (!text) return;

    const blob =
      new Blob([text], {
        type: "text/plain;charset=utf-8"
      });

    const link =
      document.createElement("a");

    link.href =
      URL.createObjectURL(blob);

    link.download =
      "HWA-AI-Myanmar-Recap.txt";

    link.click();

    URL.revokeObjectURL(link.href);
  }


  // ==============================
  // LOGOUT
  // ==============================

  async function logout() {

    await supabaseClient.auth.signOut();

    location.reload();
  }


  // ==============================
  // START
  // ==============================

  checkUser();

</script>

</body>
  </html>
